name: Update Twine cask

on:
  repository_dispatch:
    types: [twine-release-published]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: update-twine-cask
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Authenticate the tap update bot
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Update from the latest published stable release
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: make update
      - name: Install validation tools
        if: steps.update.outputs.changed == 'true'
        run: brew install actionlint shellcheck
      - name: Validate the updated cask
        if: steps.update.outputs.changed == 'true'
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          make check
          make audit-online
          make install-smoke
      - name: Open the update PR and merge after validation
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_CHECK_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.update.outputs.version }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: python3 scripts/propose_update.py
